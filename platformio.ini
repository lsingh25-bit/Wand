; platformio.ini -- one source tree, five named build targets.

[platformio]
src_dir = firmware

[env]
platform = espressif32
board = esp32dev              ; classic 30-pin ESP32-WROOM-32 DevKit
framework = arduino
monitor_speed = 115200        ; FIXED: 921600 to 115200 for clean serial output
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I shared
    -I firmware/common
    -Os
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    fastled/FastLED @ 3.6.0

; --- BNO055 acceptance suite. Run this before soldering and before collecting.
[env:bringup]
build_src_filter = +<wand_tools/*> +<common/*>
build_flags =
    ${env.build_flags}

; --- data collection. Serial is REQUIRED here and forbidden everywhere else.
[env:logger]
build_src_filter = +<wand_logger/*> +<common/*>
build_flags =
    ${env.build_flags}
    -DDEBUG_SERIAL=Serial

; --- THE DEMO BUILD.
[env:infer_nn]
build_src_filter = +<wand_infer/*> -<wand_infer/parity_host.cpp> +<common/*>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ${env.lib_deps}
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
build_flags =
    ${env.build_flags}
    -DUSE_NN_PATH=1
    -DAUTO_SEGMENTATION=1

; --- fallback if the CNN underperforms on real data: DTW templates, no training.
[env:infer_dtw]
build_src_filter = +<wand_infer/*> -<wand_infer/parity_host.cpp> +<common/*>
build_flags =
    ${env.build_flags}
    -DUSE_NN_PATH=0
    -DAUTO_SEGMENT=0

; --- backup demo mode
[env:infer_nn_autoseg]
build_src_filter = +<wand_infer/*> -<wand_infer/parity_host.cpp> +<common/*>
lib_deps =
    ${env.lib_deps}
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
build_flags =
    ${env.build_flags}
    -DUSE_NN_PATH=1
    -DAUTO_SEGMENT=1